name: AymOS firmware and emulator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware-and-renode:
    name: F401RE kernel and workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked project-local dependencies
        run: make setup

      - name: Build and validate the F401RE firmware
        run: make firmware

      - name: Run host tests
        run: make test

      - name: Check Cortex-M4 DSP instruction selection
        run: make check-dsp-codegen

      - name: Run one clean emulator boot
        run: make test-emulator

      - name: Run one ARM kernel lifecycle scenario
        run: make test-lifecycle

      - name: Run one deterministic ARM EDF scenario
        run: make test-edf

      - name: Run one allocator and task-reuse scenario
        run: make test-allocator

      - name: Build, decode, and check one structured ARM trace
        run: make test-trace

      - name: Run the normal and overload scheduling workloads
        run: make demo

      - name: Run both DSP images and create the report
        run: make demo-dsp

      - name: Retain firmware and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aymos-f401re-renode-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/nucleo_f401re/boot/
            build/nucleo_f401re/lifecycle/
            build/nucleo_f401re/edf/
            build/nucleo_f401re/allocator/
            build/nucleo_f401re/trace/
            build/nucleo_f401re/deadline_lab/
            build/nucleo_f401re/signal_lab/
            build/signal-lab/evidence/
            build/native/
            build/renode/
            runs/
